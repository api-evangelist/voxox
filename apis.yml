aid: voxox
name: Voxox
description: >-
  Voxox is the trade name of Telcentris, Inc., a San Diego, California cloud communications
  provider founded in 2006 by Bryan, Kevin and Robert Hertz. It sold hosted business phone
  service (Voxox Cloud Phone), wholesale SIP voice termination and A2P/wholesale SMS
  messaging, the latter offered to carriers and resellers over an HTTP API and SMPP. The
  developer surface was never published openly: the wholesale SMS API reference was issued
  privately by an account manager rather than posted as a public reference or machine-readable
  specification. As of December 2025 voxox.com resolves to a registrar parking page, the
  domain carries no MX record, and every developer, docs, support and application subdomain
  the company operated has stopped resolving.
